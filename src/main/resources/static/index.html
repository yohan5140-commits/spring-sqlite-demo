<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a78d6%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<title>demo</title>
<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.07);
      --series: #3987e5;
    }
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; }
  .sub { margin: 4px 0 28px; color: var(--ink-2); }
  h2 { margin: 28px 0 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); }

  .apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .app { display: block; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: inherit; text-decoration: none; }
  .app:hover { background: var(--wash); }
  .app strong { display: block; font-size: 16px; }
  .app span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 13px; }
  a:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }

  .api { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .api li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .api li:last-child { border-bottom: 0; }
  .api a { color: var(--series); text-decoration: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
  .api a:hover { text-decoration: underline; }
  .api span { color: var(--muted); font-size: 13px; text-align: right; }

  @media (max-width: 520px) { .apps { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main class="wrap">
  <h1>demo</h1>
  <p class="sub">Spring Boot + SQLite 예제 앱입니다.</p>

  <nav class="apps" aria-label="화면">
    <a class="app" href="/ledger"><strong>가계부</strong><span>수입·지출 기록, 월별 요약, 예산</span></a>
    <a class="app" href="/dashboard"><strong>사용자 대시보드</strong><span>가입 추이, 이메일 도메인, 최근 가입자</span></a>
  </nav>

  <h2>API (GET)</h2>
  <ul class="api">
    <li><a href="/users">/users</a><span>사용자 목록 (페이징·정렬)</span></li>
    <li><a href="/ledger/summary">/ledger/summary</a><span>이번 달 가계부 요약</span></li>
    <li><a href="/ledger/entries">/ledger/entries</a><span>이번 달 내역</span></li>
    <li><a href="/ledger/budgets">/ledger/budgets</a><span>예산 목록</span></li>
    <li><a href="/dashboard/stats">/dashboard/stats</a><span>사용자 통계</span></li>
  </ul>
</main>
</body>
</html>
