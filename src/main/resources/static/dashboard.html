<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232a78d6%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 font-family=%27sans-serif%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<title>사용자 대시보드</title>
<style>
  :root {
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.05);
    --series: #2a78d6;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.07);
      --series: #3987e5;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

  .filters { display: flex; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .filters button, .refresh {
    font: inherit; color: var(--ink-2); background: transparent; border: 0; border-radius: 6px;
    padding: 5px 12px; cursor: pointer;
  }
  .filters button:hover, .refresh:hover { background: var(--wash); }
  .filters button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 600; }
  button:focus-visible, summary:focus-visible, .row:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .head-right { display: flex; gap: 8px; align-items: center; }
  .refresh { border: 1px solid var(--border); background: var(--surface); }

  .content { transition: opacity .15s; }
  .content.loading { opacity: .55; }

  .tiles { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card, .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .label { margin: 0; color: var(--ink-2); font-size: 13px; font-weight: 500; }
  .hero-num { margin: 4px 0 0; font-size: clamp(48px, 8vw, 72px); line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .unit { font-size: 16px; font-weight: 500; color: var(--ink-2); margin-left: 4px; letter-spacing: 0; }
  .num { margin: 6px 0 0; font-size: 28px; line-height: 1.2; font-weight: 600; }
  .num.small { font-size: 15px; line-height: 1.6; font-weight: 600; }

  .card { margin-bottom: 12px; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .hint { margin: 0; color: var(--muted); font-size: 12px; }
  /* minmax(0, …): 그리드 항목의 최소 폭이 내부 표(nowrap)에 끌려 넓어지지 않게 한다 */
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; }
  .grid2 .card { margin-bottom: 0; }

  .chart { width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: inherit; }
  .bar { fill: var(--series); transition: opacity .1s; }
  .bar.on { opacity: .75; }
  .hit { fill: transparent; outline: none; }
  .hit:focus-visible { fill: var(--wash); }

  .domains { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: minmax(80px, 38%) 1fr; align-items: center; gap: 12px; padding: 5px 4px; border-radius: 6px; }
  .row:hover { background: var(--wash); }
  .dom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .track { display: flex; align-items: center; gap: 8px; }
  .fill { height: 16px; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
  .row.on .fill { opacity: .75; }
  .val { font-weight: 600; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
  td { padding: 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.num-col, th.num-col { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--ink-2); font-size: 13px; width: fit-content; border-radius: 4px; }
  details table { margin-top: 8px; max-width: 360px; }

  .empty { margin: 0; padding: 28px 0; text-align: center; color: var(--muted); }
  .error { margin: 0 0 12px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--critical); color: var(--ink); background: var(--surface); }
  .error::before { content: "⚠ "; color: var(--critical); }

  #tip { position: fixed; z-index: 10; pointer-events: none; padding: 6px 10px; border-radius: 6px; background: var(--ink); color: var(--page); font-size: 12px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #tip strong { display: block; font-size: 14px; }

  @media (max-width: 760px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tiles .hero, .tiles .tile:last-child { grid-column: 1 / -1; }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .grid2 .card { margin-bottom: 12px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>사용자 대시보드</h1>
      <p class="sub" id="updated">불러오는 중…</p>
    </div>
    <div class="head-right">
      <div class="filters" role="group" aria-label="조회 기간">
        <button type="button" data-days="7" aria-pressed="false">7일</button>
        <button type="button" data-days="14" aria-pressed="true">14일</button>
        <button type="button" data-days="30" aria-pressed="false">30일</button>
        <button type="button" data-days="90" aria-pressed="false">90일</button>
      </div>
      <button type="button" class="refresh" id="refresh">새로고침</button>
    </div>
  </header>

  <p class="error" id="error" role="alert" hidden></p>

  <div class="content" id="content">
    <section class="tiles" aria-label="요약">
      <article class="tile hero">
        <h2 class="label">전체 사용자</h2>
        <p class="hero-num"><span id="total">–</span><span class="unit">명</span></p>
      </article>
      <article class="tile">
        <h2 class="label">오늘 가입</h2>
        <p class="num"><span id="today">–</span><span class="unit">명</span></p>
      </article>
      <article class="tile">
        <h2 class="label" id="periodLabel">기간 내 가입</h2>
        <p class="num"><span id="period">–</span><span class="unit">명</span></p>
      </article>
      <article class="tile">
        <h2 class="label">마지막 가입</h2>
        <p class="num small" id="latest">–</p>
      </article>
    </section>

    <section class="card" aria-labelledby="dailyTitle">
      <div class="card-head">
        <h2 id="dailyTitle">일별 가입자</h2>
        <p class="hint">KST 기준</p>
      </div>
      <div class="chart" id="daily"></div>
      <details>
        <summary>표로 보기</summary>
        <table>
          <thead><tr><th>날짜</th><th class="num-col">가입자</th></tr></thead>
          <tbody id="dailyTable"></tbody>
        </table>
      </details>
    </section>

    <div class="grid2">
      <section class="card" aria-labelledby="domTitle">
        <div class="card-head">
          <h2 id="domTitle">이메일 도메인</h2>
          <p class="hint">가입자 수</p>
        </div>
        <ul class="domains" id="domains"></ul>
      </section>

      <section class="card" aria-labelledby="recentTitle">
        <div class="card-head">
          <h2 id="recentTitle">최근 가입자</h2>
          <p class="hint">최대 5명</p>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>이름</th><th>이메일</th><th>가입 시각</th></tr></thead>
            <tbody id="recent"></tbody>
          </table>
        </div>
        <p class="empty" id="recentEmpty" hidden>이 기간에 가입한 사용자가 없습니다.</p>
      </section>
    </div>
  </div>
</main>

<div id="tip" role="tooltip" hidden><strong id="tipVal"></strong><span id="tipLabel"></span></div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const fmt = n => Number(n).toLocaleString('ko-KR');
  const state = { days: 14, data: null, drawnWidth: 0 };

  // ---------- 툴팁 (내용은 textContent로만 넣는다) ----------
  const tip = $('tip');
  function showTip(value, label, x, y) {
    $('tipVal').textContent = value;
    $('tipLabel').textContent = label;
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 12)) + 'px';
    tip.style.top = Math.max(8, y - r.height - 12) + 'px';
  }
  const hideTip = () => { tip.hidden = true; };

  // ---------- 데이터 로딩 ----------
  async function load() {
    const content = $('content');
    content.classList.add('loading');
    try {
      const res = await fetch('/dashboard/stats?days=' + state.days);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      state.data = await res.json();
      $('error').hidden = true;
      render();
      $('updated').textContent = '마지막 갱신 ' +
        new Date().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul' }) + ' · 30초마다 자동 갱신';
    } catch (e) {
      $('error').textContent = '데이터를 불러오지 못했습니다. (' + e.message + ')';
      $('error').hidden = false;
    } finally {
      content.classList.remove('loading');
    }
  }

  function render() {
    const d = state.data;
    $('total').textContent = fmt(d.total);
    $('today').textContent = fmt(d.today);
    $('period').textContent = fmt(d.period);
    $('periodLabel').textContent = '최근 ' + d.days + '일 가입';
    $('latest').textContent = d.latestAt || '아직 없음';
    $('dailyTitle').textContent = '일별 가입자 (최근 ' + d.days + '일)';
    drawDaily();
    renderDailyTable();
    renderDomains();
    renderRecent();
  }

  // ---------- 일별 가입자: 세로 막대 ----------
  function svgEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // 눈금이 정수이고 4칸 이내가 되도록 최댓값을 올림한다
  function niceAxis(max) {
    if (max <= 0) return { step: 1, top: 1 };
    const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
    const step = steps.find(s => max / s <= 4) || Math.ceil(max / 4);
    return { step, top: Math.ceil(max / step) * step };
  }

  function drawDaily() {
    const host = $('daily');
    const daily = state.data.daily;
    const W = host.clientWidth || 640;
    const H = 240;
    const m = { l: 36, r: 8, t: 20, b: 26 };
    const innerW = W - m.l - m.r, innerH = H - m.t - m.b;
    state.drawnWidth = W;
    host.replaceChildren();

    const max = Math.max(0, ...daily.map(p => p.count));
    const { step, top } = niceAxis(max);
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': '일별 가입자 막대 차트. 자세한 값은 아래 표로 보기에서 확인할 수 있습니다.' });

    // 격자(헤어라인, 실선)와 Y 눈금
    for (let v = 0; v <= top; v += step) {
      const y = m.t + innerH - (v / top) * innerH;
      svg.append(svgEl('line', { x1: m.l, x2: W - m.r, y1: y, y2: y,
        stroke: v === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const t = svgEl('text', { x: m.l - 8, y: y + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)' });
      t.textContent = fmt(v);
      svg.append(t);
    }

    const band = innerW / daily.length;
    const bw = Math.min(24, band * 0.6);
    const every = Math.ceil(48 / band);
    const peak = max > 0 ? daily.findIndex(p => p.count === max) : -1;

    daily.forEach((p, i) => {
      const x0 = m.l + i * band;
      const x = x0 + (band - bw) / 2;
      const h = (p.count / top) * innerH;
      const y = m.t + innerH - h;

      let bar = null;
      if (p.count > 0) {
        // 위쪽 모서리만 4px 둥글게, 바닥은 직각
        const r = Math.min(4, h, bw / 2);
        bar = svgEl('path', { class: 'bar',
          d: `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + bw - r},${y} Q${x + bw},${y} ${x + bw},${y + r} L${x + bw},${y + h} Z` });
        svg.append(bar);
      }

      if (i % every === 0) {
        const t = svgEl('text', { x: x0 + band / 2, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' });
        t.textContent = p.date.slice(5);
        svg.append(t);
      }

      if (i === peak) {
        const t = svgEl('text', { x: x0 + band / 2, y: y - 6, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: 'var(--ink-2)' });
        t.textContent = fmt(p.count);
        svg.append(t);
      }

      // 막대보다 훨씬 넓은 투명 영역을 호버·포커스 대상으로 쓴다
      const hit = svgEl('rect', { class: 'hit', x: x0, y: m.t, width: band, height: innerH + 4, tabindex: 0,
        role: 'img', 'aria-label': `${p.date} ${p.count}명` });
      const on = (cx, cy) => { bar && bar.classList.add('on'); showTip(fmt(p.count) + '명', p.date, cx, cy); };
      const off = () => { bar && bar.classList.remove('on'); hideTip(); };
      hit.addEventListener('pointermove', e => on(e.clientX, e.clientY));
      hit.addEventListener('pointerleave', off);
      hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); on(r.left + r.width / 2, r.top + 24); });
      hit.addEventListener('blur', off);
      svg.append(hit);
    });

    if (max === 0) {
      const t = svgEl('text', { x: m.l + innerW / 2, y: m.t + innerH / 2, 'text-anchor': 'middle', 'font-size': 13, fill: 'var(--muted)' });
      t.textContent = '이 기간에 가입한 사용자가 없습니다.';
      svg.append(t);
    }
    host.append(svg);
  }

  function renderDailyTable() {
    const body = $('dailyTable');
    body.replaceChildren();
    [...state.data.daily].reverse().forEach(p => {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = p.date; a.className = 'mono';
      const b = document.createElement('td'); b.textContent = fmt(p.count); b.className = 'num-col';
      tr.append(a, b);
      body.append(tr);
    });
  }

  // ---------- 이메일 도메인: 가로 막대 ----------
  function renderDomains() {
    const ul = $('domains');
    ul.replaceChildren();
    const rows = state.data.domains;
    if (!rows.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '이 기간에 가입한 사용자가 없습니다.';
      ul.append(li);
      return;
    }
    const max = rows[0].count;
    const sum = rows.reduce((s, r) => s + r.count, 0);
    rows.forEach(r => {
      const li = document.createElement('li');
      li.className = 'row';
      li.tabIndex = 0;
      const name = document.createElement('span'); name.className = 'dom'; name.textContent = r.domain;
      const track = document.createElement('span'); track.className = 'track';
      const fill = document.createElement('span'); fill.className = 'fill'; fill.style.width = (r.count / max * 85) + '%';
      const val = document.createElement('span'); val.className = 'val'; val.textContent = fmt(r.count);
      track.append(fill, val);
      li.append(name, track);

      const label = r.domain + ' · ' + Math.round(r.count / sum * 100) + '%';
      const on = (x, y) => { li.classList.add('on'); showTip(fmt(r.count) + '명', label, x, y); };
      const off = () => { li.classList.remove('on'); hideTip(); };
      li.addEventListener('pointermove', e => on(e.clientX, e.clientY));
      li.addEventListener('pointerleave', off);
      li.addEventListener('focus', () => { const b = li.getBoundingClientRect(); on(b.left + b.width / 2, b.top); });
      li.addEventListener('blur', off);
      ul.append(li);
    });
  }

  // ---------- 최근 가입자 ----------
  function renderRecent() {
    const body = $('recent');
    body.replaceChildren();
    const rows = state.data.recent;
    $('recentEmpty').hidden = rows.length > 0;
    rows.forEach(u => {
      const tr = document.createElement('tr');
      [['name', u.name], ['', u.email], ['mono', u.createdAt]].forEach(([cls, text]) => {
        const td = document.createElement('td');
        td.textContent = text ?? '';
        if (cls === 'mono') td.className = 'mono';
        tr.append(td);
      });
      body.append(tr);
    });
  }

  // ---------- 이벤트 ----------
  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.days = Number(btn.dataset.days);
      document.querySelectorAll('.filters button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      load();
    });
  });
  $('refresh').addEventListener('click', load);
  new ResizeObserver(() => {
    const w = $('daily').clientWidth;
    if (state.data && w && Math.abs(w - state.drawnWidth) > 1) drawDaily();
  }).observe($('daily'));
  setInterval(() => { if (!document.hidden) load(); }, 30000);

  load();
})();
</script>
</body>
</html>
